# Configuración de lint compartida por los dos microservicios.
# Se declara explícitamente para que el resultado no cambie cuando ruff
# amplíe su conjunto de reglas por defecto en una versión futura.

target-version = "py312"
line-length = 110

[lint]
select = [
    "E4", "E7", "E9",  # errores de sintaxis y estructura
    "E501",            # línea de más: line-length = 110 por fin es efectivo
    "F",               # pyflakes: imports sin usar, variables no definidas
    "W",               # avisos de espacios en blanco
    "I",               # orden de los imports
    "B",               # bugbear: trampas comunes
    "BLE",             # except demasiado amplios
    "DTZ",             # datetime sin zona horaria
    "C4",              # comprensiones innecesarias
    "UP",              # sintaxis moderna de Python
]

ignore = [
    # B008: "no llames funciones en los valores por defecto de los argumentos".
    # `db: Session = Depends(get_db)` es el modismo OFICIAL de FastAPI para la
    # inyección de dependencias: FastAPI no ejecuta esa llamada como un default
    # de Python, la resuelve por petición. Aquí la regla no aplica.
    "B008",
]

[lint.isort]
# `app` es el paquete propio del servicio, no una dependencia externa:
# sin esto, ruff lo agrupa junto a fastapi y sqlalchemy.
known-first-party = ["app"]
