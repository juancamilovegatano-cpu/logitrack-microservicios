<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="flechaEvento" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="flechaRest" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <marker id="flechaDatos" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#ffffff"/>

  <!-- ================= Encabezado ================= -->
  <text x="500" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">
    LogiTrack — Fleet Service + Maintenance Service
  </text>
  <text x="500" y="64" text-anchor="middle" font-size="13.5" fill="#475569">
    Arquitectura de microservicios · comunicación síncrona (REST) y asíncrona (eventos) · Python 3.12 · FastAPI · PostgreSQL 16 · RabbitMQ · Docker
  </text>

  <!-- ================= Productor externo ================= -->
  <rect x="30" y="100" width="215" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="137" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Tracking Service</text>
  <text x="137" y="143" text-anchor="middle" font-size="11" fill="#64748b">no implementado · simulado</text>

  <!-- ================= Bus ================= -->
  <rect x="300" y="93" width="400" height="152" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="500" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">RabbitMQ — bus de eventos</text>

  <rect x="320" y="133" width="172" height="26" rx="5" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="406" y="151" text-anchor="middle" font-size="11.5" fill="#4c1d95">logitrack.fleet</text>
  <rect x="508" y="133" width="172" height="26" rx="5" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="594" y="151" text-anchor="middle" font-size="11.5" fill="#4c1d95">logitrack.maintenance</text>
  <rect x="320" y="167" width="172" height="26" rx="5" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="406" y="185" text-anchor="middle" font-size="11.5" fill="#4c1d95">logitrack.tracking</text>
  <rect x="508" y="167" width="172" height="26" rx="5" fill="#fee2e2" stroke="#f87171"/>
  <text x="594" y="185" text-anchor="middle" font-size="11.5" fill="#991b1b">logitrack.dlx  (DLQ)</text>

  <text x="500" y="217" text-anchor="middle" font-size="11" fill="#6d28d9">
    colas durables: fleet.inbox · maintenance.inbox (+ sus .dlq)
  </text>
  <text x="500" y="233" text-anchor="middle" font-size="11" fill="#6d28d9">
    entrega at-least-once · 5 reintentos · dead letter exchange
  </text>

  <!-- Tracking -> bus -->
  <path d="M 245 129 L 292 143" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#flechaEvento)"/>
  <text x="137" y="180" text-anchor="middle" font-size="10.5" fill="#6d28d9">publica telemetry.aggregated</text>

  <!-- ================= Servicios ================= -->
  <!-- Fleet -->
  <rect x="30" y="320" width="330" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="195" y="346" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e40af">Fleet Service</text>
  <text x="195" y="365" text-anchor="middle" font-size="11" fill="#1d4ed8">ficha 3.2 · puerto 8001 · FastAPI</text>
  <line x1="48" y1="376" x2="342" y2="376" stroke="#bfdbfe" stroke-width="1"/>
  <text x="48" y="394" font-size="11" fill="#334155">Catálogo maestro de vehículos y conductores</text>
  <text x="48" y="411" font-size="11" fill="#334155">Único dueño del estado del vehículo</text>
  <text x="48" y="428" font-size="11" fill="#334155">GET /vehiculos/disponibles · POST · PATCH /estado</text>
  <text x="48" y="445" font-size="11" fill="#334155">Servidor REST · publica y consume eventos</text>

  <!-- Maintenance -->
  <rect x="640" y="320" width="330" height="132" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="805" y="346" text-anchor="middle" font-size="15.5" font-weight="700" fill="#15803d">Maintenance Service</text>
  <text x="805" y="365" text-anchor="middle" font-size="11" fill="#16a34a">ficha 3.6 · puerto 8006 · FastAPI</text>
  <line x1="658" y1="376" x2="952" y2="376" stroke="#bbf7d0" stroke-width="1"/>
  <text x="658" y="394" font-size="11" fill="#334155">Reglas por métrica, umbral y tipo de vehículo</text>
  <text x="658" y="411" font-size="11" fill="#334155">Programas, alertas e intervenciones de taller</text>
  <text x="658" y="428" font-size="11" fill="#334155">POST /reglas · /intervenciones · GET /alertas</text>
  <text x="658" y="445" font-size="11" fill="#334155">Cliente REST de Fleet · publica y consume</text>

  <!-- ================= Comunicación SÍNCRONA ================= -->
  <rect x="372" y="330" width="256" height="76" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="500" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">SÍNCRONO — REST</text>
  <text x="500" y="366" text-anchor="middle" font-size="10.5" fill="#115e59">GET /api/v1/vehiculos/{id}</text>
  <text x="500" y="382" text-anchor="middle" font-size="10" fill="#0f766e">timeout 2 s · 3 reintentos (1/2/4 s + jitter)</text>
  <text x="500" y="396" text-anchor="middle" font-size="10" fill="#0f766e">circuit breaker 5 fallos/30 s · plan B</text>

  <path d="M 638 424 L 366 424" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#flechaRest)"/>
  <text x="502" y="440" text-anchor="middle" font-size="10" fill="#0f766e">pregunta tipo, placa y kilometraje</text>

  <!-- ================= Flechas de eventos ================= -->
  <!-- Maintenance -> bus -->
  <path d="M 700 318 C 700 280, 660 260, 640 248" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#flechaEvento)"/>
  <text x="958" y="268" text-anchor="end" font-size="10.5" fill="#6d28d9">publica: maintenance.alert,</text>
  <text x="958" y="282" text-anchor="end" font-size="10.5" fill="#6d28d9">maintenance.completed</text>
  <text x="958" y="300" text-anchor="end" font-size="10.5" fill="#6d28d9">consume: telemetry.aggregated</text>

  <!-- bus -> Maintenance -->
  <path d="M 590 248 C 610 270, 640 290, 660 316" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#flechaEvento)"/>

  <!-- bus -> Fleet -->
  <path d="M 360 248 C 340 275, 310 295, 290 316" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#flechaEvento)"/>

  <!-- Fleet -> bus -->
  <path d="M 230 318 C 230 285, 280 262, 300 250" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#flechaEvento)"/>

  <text x="42" y="268" font-size="10.5" fill="#6d28d9">publica: vehicle.status_changed</text>
  <text x="42" y="286" font-size="10.5" fill="#6d28d9">consume: maintenance.alert,</text>
  <text x="42" y="300" font-size="10.5" fill="#6d28d9">maintenance.completed</text>

  <!-- ================= Bases de datos ================= -->
  <g>
    <ellipse cx="195" cy="524" rx="92" ry="15" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M 103 524 L 103 572 A 92 15 0 0 0 287 572 L 287 524" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="195" y="552" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">fleet_db</text>
    <text x="195" y="569" text-anchor="middle" font-size="10.5" fill="#1d4ed8">PostgreSQL 16</text>
  </g>
  <text x="195" y="604" text-anchor="middle" font-size="10" fill="#475569">vehiculos · conductores · asignaciones</text>
  <text x="195" y="619" text-anchor="middle" font-size="10" fill="#475569">outbox_eventos · eventos_procesados</text>
  <path d="M 195 456 L 195 505" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#flechaDatos)"/>

  <g>
    <ellipse cx="805" cy="524" rx="92" ry="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <path d="M 713 524 L 713 572 A 92 15 0 0 0 897 572 L 897 524" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="805" y="552" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">maintenance_db</text>
    <text x="805" y="569" text-anchor="middle" font-size="10.5" fill="#16a34a">PostgreSQL 16</text>
  </g>
  <text x="805" y="604" text-anchor="middle" font-size="10" fill="#475569">reglas · programas · intervenciones</text>
  <text x="805" y="619" text-anchor="middle" font-size="10" fill="#475569">outbox_eventos · eventos_procesados</text>
  <path d="M 805 456 L 805 505" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#flechaDatos)"/>

  <!-- Database per Service -->
  <path d="M 300 548 L 700 548" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5" fill="none"/>
  <rect x="394" y="533" width="212" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="500" y="553" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Database per Service</text>
  <text x="500" y="583" text-anchor="middle" font-size="10" fill="#991b1b">ninguna base lee la otra · cero llaves foráneas cruzadas</text>

  <!-- ================= Leyenda ================= -->
  <rect x="30" y="645" width="940" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <line x1="50" y1="666" x2="96" y2="666" stroke="#0d9488" stroke-width="2.5" marker-end="url(#flechaRest)"/>
  <text x="106" y="670" font-size="11" fill="#334155">REST síncrono: el llamador NO puede continuar sin la respuesta</text>

  <line x1="480" y1="666" x2="526" y2="666" stroke="#7c3aed" stroke-width="2" marker-end="url(#flechaEvento)"/>
  <text x="536" y="670" font-size="11" fill="#334155">publica evento (outbox transaccional)</text>

  <line x1="50" y1="688" x2="96" y2="688" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#flechaEvento)"/>
  <text x="106" y="692" font-size="11" fill="#334155">consume evento (idempotente por event_id, con DLQ)</text>

  <line x1="480" y1="688" x2="526" y2="688" stroke="#64748b" stroke-width="1.8" marker-end="url(#flechaDatos)"/>
  <text x="536" y="692" font-size="11" fill="#334155">acceso a su propia base de datos, y solo a la suya</text>

</svg>
