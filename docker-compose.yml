# =============================================================================
# LogiTrack — sistema completo, un solo contrato de eventos
# =============================================================================
#
#   docker compose up --build -d
#
# Cinco microservicios, un RabbitMQ, una base por servicio. Ya NO hay
# interop-bridge: cuando los dos repositorios hablaban dialectos distintos
# hacía falta un traductor; ahora todos publican y consumen el mismo sobre
# canónico en el exchange `logitrack.events`, así que no queda nada que
# traducir.
#
# Valores por defecto: funciona sin configurar nada. Para cambiar contraseñas
# o claves de API, copia .env.example a .env y edítalo (ver defecto 1.5).
#
# -----------------------------------------------------------------------------
# REQUISITO: los dos repositorios, clonados uno al lado del otro.
#
#   logitrack-completo/
#   ├── logitrack/         <- este repo (fleet, maintenance, frontend)
#   └── kevin-logitrack/   <- routing, shipment, tracking
#
# Si la carpeta del otro repo se llama distinto, no hay que editar nada:
#   $env:RUTA_KEVIN = '../como-se-llame'
# =============================================================================

name: logitrack

services:
  # ---------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: logitrack
      RABBITMQ_DEFAULT_PASS: logitrack
    ports:
      - "5672:5672"
      - "15672:15672" # consola web: logitrack / logitrack
    healthcheck:
      # NO usar `rabbitmq-diagnostics`: arranca un nodo Erlang efímero que lee
      # /var/lib/rabbitmq/.erlang.cookie y, al correr en paralelo con el
      # arranque, deja el archivo con permisos que el propio servidor ya no
      # puede leer — el broker muere con `eacces` antes de escuchar. Esta
      # prueba abre el puerto 5672 y no toca ningún archivo.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/5672' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  fleet-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      POSTGRES_DB: fleet_db
    ports:
      # SÍ se publica: los tests de fleet-service se conectan desde el host
      # a localhost:5432 (test_db). Las demás bases no se exponen: solo las
      # usa cada servicio por el DNS interno de Docker.
      - "5432:5432"
    volumes: [fleet_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d fleet_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  maintenance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      POSTGRES_DB: maintenance_db
    ports:
      # SÍ se publica: los tests de maintenance-service se conectan desde el
      # host a localhost:5433 (su defecto por servicio; 5432 es de fleet-db).
      - "5433:5432"
    volumes: [maintenance_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d maintenance_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  tracking-db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      POSTGRES_DB: tracking_db
    # Sin ports: ningún proceso del host necesita esta base.
    volumes: [tracking_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d tracking_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  routing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      POSTGRES_DB: routing_db
    # Sin ports: ningún proceso del host necesita esta base.
    volumes: [routing_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d routing_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  shipment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      POSTGRES_DB: shipment_db
    # Sin ports: ningún proceso del host necesita esta base.
    volumes: [shipment_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack -d shipment_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Sin ports: solo routing-service lo usa, por el DNS interno de Docker.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Microservicios de este repositorio
  # ---------------------------------------------------------------------------
  fleet-service:
    build: ./fleet-service
    environment:
      DATABASE_URL: postgresql+psycopg2://logitrack:${POSTGRES_PASSWORD:-logitrack}@fleet-db:5432/fleet_db
      RABBITMQ_URL: amqp://logitrack:logitrack@rabbitmq:5672/
      EXCHANGE_EVENTOS: logitrack.events
    ports:
      - "8001:8000"
    depends_on:
      fleet-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  maintenance-service:
    build: ./maintenance-service
    environment:
      DATABASE_URL: postgresql+psycopg2://logitrack:${POSTGRES_PASSWORD:-logitrack}@maintenance-db:5432/maintenance_db
      RABBITMQ_URL: amqp://logitrack:logitrack@rabbitmq:5672/
      EXCHANGE_EVENTOS: logitrack.events
      # REST síncrono hacia Fleet, por DNS de Docker y no por localhost.
      FLEET_BASE_URL: http://fleet-service:8000
    ports:
      # 8006, no 8002: ese lo ocupa tracking-service. El frontend lo lee de
      # VITE_MAINT_URL (ver frontend/.env.example).
      - "8006:8000"
    depends_on:
      maintenance-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      fleet-service: {condition: service_started}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Microservicios del repositorio de Kevin
  # ---------------------------------------------------------------------------
  tracking-service:
    build: ${RUTA_KEVIN:-../kevin-logitrack}/tracking-service
    environment:
      DATABASE_URL: postgresql+asyncpg://logitrack:${POSTGRES_PASSWORD:-logitrack}@tracking-db:5432/tracking_db
      POSTGRES_HOST: tracking-db
      RABBITMQ_URL: amqp://logitrack:logitrack@rabbitmq:5672/
      EXCHANGE_EVENTOS: logitrack.events
      BUS_HABILITADO: "true"
      ENTORNO: docker
      # API keys de la ingesta de telemetría (lista JSON). Con claves y
      # ENTORNO != local el servicio exige X-API-Key; si quedara vacía fuera
      # de desarrollo, NO arranca en vez de salir abierta (ver .env.example).
      API_KEYS: ${API_KEYS:-["demo-logitrack"]}
    ports: ["8002:8002"]
    depends_on:
      tracking-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

  routing-service:
    build: ${RUTA_KEVIN:-../kevin-logitrack}/routing-service
    environment:
      DATABASE_URL: postgresql+asyncpg://logitrack:${POSTGRES_PASSWORD:-logitrack}@routing-db:5432/routing_db
      POSTGRES_HOST: routing-db
      RABBITMQ_URL: amqp://logitrack:logitrack@rabbitmq:5672/
      EXCHANGE_EVENTOS: logitrack.events
      REDIS_URL: redis://redis:6379/0
      # Routing consulta Fleet por REST. El adaptador traduce los nombres de
      # campo (capacidad_m3, zona_operacion, certificado_hazmat) y el
      # vocabulario de estados. El bus ya es común; esto es solo el REST.
      FLEET_URL: http://fleet-service:8000
      FLEET_DIALECTO: companero
      BUS_HABILITADO: "true"
    ports: ["8003:8003"]
    depends_on:
      routing-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  shipment-service:
    build: ${RUTA_KEVIN:-../kevin-logitrack}/shipment-service
    environment:
      DATABASE_URL: postgresql+asyncpg://logitrack:${POSTGRES_PASSWORD:-logitrack}@shipment-db:5432/shipment_db
      POSTGRES_HOST: shipment-db
      RABBITMQ_URL: amqp://logitrack:logitrack@rabbitmq:5672/
      EXCHANGE_EVENTOS: logitrack.events
      BUS_HABILITADO: "true"
    ports: ["8004:8004"]
    depends_on:
      shipment-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped

volumes:
  fleet_data:
  maintenance_data:
  tracking_data:
  routing_data:
  shipment_data:
