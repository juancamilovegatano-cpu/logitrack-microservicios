[pytest]
# El paquete `app` vive en la raíz del servicio, no en site-packages.
#
# Sin esta línea, `pytest` invocado como comando falla con ModuleNotFoundError,
# mientras que `python -m pytest` funciona: el segundo añade el directorio
# actual al sys.path y el primero no. Declararlo aquí hace que las dos formas
# se comporten igual, en la máquina de cualquiera y en el CI.
pythonpath = .
testpaths = tests
